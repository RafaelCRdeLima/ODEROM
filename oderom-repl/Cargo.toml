[package]
name = "oderom-repl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "ODEROM terminal REPL over oderom-session -- ETAPA 2, DESIGN-UI-SESSION.md. Proves the session model end to end before any window."

[[bin]]
name = "oderom-repl"
path = "src/main.rs"

[dependencies]
oderom-cli = { path = "../oderom-cli" }
oderom-session = { path = "../oderom-session" }
oderom-expr = { path = "../oderom-expr" }
rustyline = "14"
ctrlc = "3"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
