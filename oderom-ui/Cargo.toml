[package]
name = "oderom-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "O contrato JSON entre o Rust e o frontend -- compartilhado pelo app Tauri e pela versao wasm."

[dependencies]
oderom-notebook = { path = "../oderom-notebook" }
oderom-components = { path = "../oderom-components" }
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
